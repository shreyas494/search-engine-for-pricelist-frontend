name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://search-engine-for-pricelist-backend-8s8x.onrender.com/api/health"
          echo "Pinging $URL"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 "$URL"
